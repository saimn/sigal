{% if album.breadcrumb %}
  <div class="breadcrumb">
    <h2>
      {% for url, title in album.breadcrumb %}
        {% if not loop.last %}
          <a href="{{ url }}">{{ title }}</a> » 
        {% else %}
          <span>{{ title }}</span>
        {% endif %}
      {% endfor -%}
    </h2>
  </div>
{% endif %}
